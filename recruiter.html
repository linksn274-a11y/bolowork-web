                    <input type="text" placeholder="Recherche de contacts" class="bg-transparent border-none focus:outline-none ml-2 text-sm w-full">

                <a href="talent.html" class="flex flex-col items-center justify-center hover:text-gray-800 h-full px-2 transition">

        <a href="index.html" class="flex flex-col items-center text-gray-500 flex-1 hover:text-green-600 transition">

        <a href="recruiter.html" class="flex flex-col items-center text-gray-900 flex-1 hover:text-green-600 transition">
