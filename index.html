<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BoloWork - Fil d'actualité</title>
    <!-- CSS Statique (Très rapide) -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f3f2ef; } /* Couleur de fond exacte de LinkedIn */
        .modal-active { display: flex !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @media (min-width: 1024px) {
            .lg-grid { grid-template-columns: 225px minmax(0,1fr) 300px; }
        }
    </style>
</head>
<body class="text-gray-800 font-sans antialiased overflow-x-hidden">

    <!-- Navbar Globale Supérieure -->
    <nav class="bg-white border-b border-gray-200 fixed top-0 w-full z-50 h-14 flex items-center">
        <div class="max-w-6xl mx-auto w-full px-4 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-9 h-9 bg-green-600 text-white rounded flex items-center justify-center font-bold text-xl tracking-tighter">bw</div>
                <div class="hidden md:flex bg-blue-50 rounded px-3 py-1.5 items-center w-64 focus-within:w-80 transition-all duration-300">
                    <i class="fas fa-search text-gray-500 text-sm"></i>
                    <input type="text" placeholder="Recherche" class="bg-transparent border-none focus:outline-none ml-2 text-sm w-full">
                </div>
            </div>
            <div class="hidden md:flex items-center space-x-6 text-gray-500 h-full">
                <a href="#" class="flex flex-col items-center justify-center text-green-700 border-b-2 border-green-700 h-full px-2">
                    <i class="fas fa-home text-xl"></i><span class="text-xs font-semibold mt-1">Accueil</span>
                </a>
                <a href="recruiter.html" class="flex flex-col items-center justify-center hover:text-gray-800 h-full px-2 transition">
                    <i class="fas fa-user-friends text-xl"></i><span class="text-xs font-semibold mt-1">Réseau</span>
                </a>
                <a href="#" class="flex flex-col items-center justify-center hover:text-gray-800 h-full px-2 transition">
                    <i class="fas fa-briefcase text-xl"></i><span class="text-xs font-semibold mt-1">Emplois</span>
                </a>
                <a href="#" class="flex flex-col items-center justify-center hover:text-gray-800 h-full px-2 transition">
                    <i class="fas fa-comment-dots text-xl"></i><span class="text-xs font-semibold mt-1">Messagerie</span>
                </a>
                <a href="#" class="flex flex-col items-center justify-center hover:text-gray-800 h-full px-2 transition">
                    <i class="fas fa-bell text-xl"></i><span class="text-xs font-semibold mt-1">Notifications</span>
                </a>
            </div>
            <div class="md:hidden flex items-center space-x-4 text-gray-500">
                <i class="fas fa-comment-dots text-2xl"></i>
            </div>
        </div>
    </nav>

    <!-- Structure en Grille -->
    <div class="max-w-6xl mx-auto pt-20 px-4 grid grid-cols-1 lg:grid-cols-3 lg-grid gap-6 pb-24">
        
        <div class="hidden lg:block space-y-2">
            <div class="bg-white rounded-lg border border-gray-200 overflow-hidden shadow-sm relative">
                <div id="mini-cover" class="h-14 bg-gray-300 relative cursor-pointer cover-bg" onclick="window.location.href='profile.html'"></div>
                <div class="flex justify-center -mt-8 relative cursor-pointer" onclick="window.location.href='profile.html'">
                    <img id="mini-avatar" src="https://ui-avatars.com/api/?name=U&background=random" class="w-16 h-16 rounded-full border-2 border-white object-cover shadow-sm bg-white">
                </div>
                <div class="text-center mt-3 pb-4 border-b border-gray-200">
                    <h3 id="mini-name" class="font-bold text-gray-900 hover:underline cursor-pointer" onclick="window.location.href='profile.html'">Utilisateur</h3>
                    <p id="mini-headline" class="text-xs text-gray-500 mt-1 px-4 line-clamp-2">Profil en cours de création</p>
                </div>
                <div class="py-3 px-4 hover:bg-gray-50 cursor-pointer transition">
                    <div class="flex justify-between text-xs font-semibold">
                        <span class="text-gray-500">Relations</span>
                        <span class="text-blue-600">10</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="w-full max-w-[600px] mx-auto lg:mx-0 lg:max-w-none space-y-4">
            <div class="bg-white rounded-lg border border-gray-200 p-3">
                <div class="flex items-center space-x-2 mb-2">
                    <div class="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center text-gray-400 shrink-0"><i class="fas fa-user"></i></div>
                    <button onclick="toggleModal('post-modal')" class="flex-grow text-left bg-white border border-gray-400 hover:bg-gray-100 rounded-full py-3 px-4 text-gray-500 font-semibold transition">
                        Commencer un post
                    </button>
                </div>
                <div class="flex justify-around pt-2">
                    <button class="flex items-center space-x-2 text-gray-500 hover:bg-gray-100 p-3 rounded-md font-semibold text-sm transition">
                        <i class="fas fa-image text-blue-500 text-xl"></i> <span class="hidden sm:inline">Média</span>
                    </button>
                    <button onclick="startVoicePost()" class="flex items-center space-x-2 text-gray-500 hover:bg-gray-100 p-3 rounded-md font-semibold text-sm transition tooltip" title="Parler à l'IA">
                        <i class="fas fa-microphone text-green-600 text-xl"></i> <span class="hidden sm:inline">Vocal (IA)</span>
                    </button>
                    <button class="flex items-center space-x-2 text-gray-500 hover:bg-gray-100 p-3 rounded-md font-semibold text-sm transition">
                        <i class="fas fa-briefcase text-purple-500 text-xl"></i> <span class="hidden sm:inline">Offre d'emploi</span>
                    </button>
                </div>
            </div>
            
            <div id="new-posts-area">
                <p class="text-center text-gray-500 py-8"><i class="fas fa-spinner fa-spin text-2xl"></i><br>Chargement du fil...</p>
            </div>
        </div>

        <div class="hidden lg:block space-y-4">
            <div class="bg-white rounded-lg border border-gray-200 p-4 sticky top-20">
                <h3 class="font-bold text-gray-900 mb-4 text-sm">Ajouter à votre fil d'actualité</h3>
                <div class="flex items-start space-x-3 mb-4">
                    <div class="w-12 h-12 bg-gray-800 text-white rounded-full flex items-center justify-center font-bold text-xs shrink-0">SN</div>
                    <div>
                        <h4 class="font-bold text-gray-800 text-sm">SenTech Solutions</h4>
                        <button class="text-gray-600 border border-gray-500 hover:bg-gray-100 px-4 py-1.5 rounded-full font-bold text-sm transition mt-2"><i class="fas fa-plus"></i> Suivre</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DE CRÉATION DE POST -->
    <div id="post-modal" class="hidden fixed inset-0 bg-black bg-opacity-60 z-50 flex items-start justify-center pt-20 px-4">
        <div class="bg-white rounded-lg w-full max-w-lg shadow-2xl overflow-hidden flex flex-col">
            <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                <h2 class="text-xl font-normal text-gray-800">Créer un post</h2>
                <button onclick="toggleModal('post-modal')" class="text-gray-500 hover:bg-gray-100 w-10 h-10 flex items-center justify-center rounded-full transition">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div class="p-6">
                <textarea id="post-content" rows="5" class="w-full resize-none text-lg text-gray-800 placeholder-gray-500 focus:outline-none" placeholder="De quoi souhaitez-vous discuter ?"></textarea>
            </div>
            <div class="px-6 py-3 flex justify-end">
                <button onclick="publishPost()" class="bg-gray-200 text-gray-400 font-bold py-1.5 px-4 rounded-full transition" id="post-btn">
                    Publier
                </button>
            </div>
        </div>
    </div>

    <!-- Bottom Tab Bar (Mobile) - Ajusté pour iPhone (Safe Area) -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 w-full bg-white border-t border-gray-200 flex justify-around items-start pt-2 z-50 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)]" style="padding-bottom: calc(10px + env(safe-area-inset-bottom));">
        <a href="index.html" class="flex flex-col items-center text-gray-900 flex-1 hover:text-green-600 transition">
            <i class="fas fa-home text-xl mb-1"></i><span style="font-size: 10px;" class="font-semibold">Accueil</span>
        </a>
        <a href="recruiter.html" class="flex flex-col items-center text-gray-500 flex-1 hover:text-green-600 transition">
            <i class="fas fa-user-friends text-xl mb-1"></i><span style="font-size: 10px;" class="font-semibold">Réseau</span>
        </a>
        <a href="#" onclick="toggleModal('post-modal')" class="flex flex-col items-center text-gray-500 flex-1 hover:text-green-600 transition">
            <i class="fas fa-plus-square text-xl mb-1"></i><span style="font-size: 10px;" class="font-semibold">Publier</span>
        </a>
        <a href="#" onclick="alert('Vos notifications arriveront ici !')" class="flex flex-col items-center text-gray-500 flex-1 hover:text-green-600 transition">
            <i class="fas fa-bell text-xl mb-1"></i><span style="font-size: 10px;" class="font-semibold">Notifs</span>
        </a>
        <a href="talent.html" class="flex flex-col items-center text-gray-500 flex-1 hover:text-green-600 transition">
            <i class="fas fa-briefcase text-xl mb-1"></i><span style="font-size: 10px;" class="font-semibold">Emplois</span>
        </a>
    </nav>

    <!-- Inclusion de la logique Supabase -->
    <script type="module" src="app.js"></script>
</body>
</html>
