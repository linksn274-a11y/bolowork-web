<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BoloWork - Connexion</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f3f2ef; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-green-600 text-white rounded-2xl flex items-center justify-center font-bold text-4xl tracking-tighter mx-auto mb-4 shadow-lg">bw</div>
            <h1 class="text-2xl font-bold text-gray-900" id="form-title">Bienvenue sur BoloWork</h1>
            <p class="text-gray-500 mt-2 text-sm" id="form-subtitle">Connectez-vous avec votre numéro de téléphone.</p>
        </div>
        
        <form id="auth-form" class="space-y-5">
            <div id="name-field" class="hidden">
                <label class="block text-sm font-bold text-gray-700 mb-1">Nom complet</label>
                <div class="relative">
                    <i class="fas fa-user absolute left-4 top-3.5 text-gray-400"></i>
                    <input type="text" id="fullname" placeholder="Ex: Moussa Diop" class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-500 bg-gray-50 focus:bg-white transition">
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Numéro de téléphone</label>
                <div class="relative">
                    <i class="fas fa-phone absolute left-4 top-3.5 text-gray-400"></i>
                    <input type="tel" id="phone" placeholder="77 123 45 67" class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-500 bg-gray-50 focus:bg-white transition font-semibold tracking-wide" required>
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Code PIN (4 chiffres)</label>
                <div class="relative flex justify-center">
                    <input type="password" id="pin" pattern="[0-9]{4}" maxlength="4" placeholder="••••" class="w-full py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-500 bg-gray-50 focus:bg-white transition text-center tracking-[1em] text-2xl font-bold" required>
                </div>
            </div>
            
            <button type="submit" id="submit-btn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3.5 px-4 rounded-xl transition shadow-md flex justify-center items-center text-lg mt-2">
                Se connecter
            </button>
        </form>
        
        <div class="mt-8 text-center pt-6 border-t border-gray-100">
            <p class="text-gray-600 text-sm">
                <span id="toggle-text">Nouveau sur BoloWork ?</span> 
                <button onclick="toggleMode()" id="toggle-btn" class="text-green-700 font-bold hover:underline ml-1">S'inscrire gratuitement</button>
            </p>
        </div>
    </div>

    <script type="module" src="auth.js"></script>
</body>
</html>
